<!doctype html>
<html>
  <body>
    <div id="page-chats" class="whole page-chats">
      <div id="column-left"></div>
      <div id="column-center">
        <div class="chats-container">
          <div class="chat active" data-type="chat">
            <div class="topbar"><div class="peer-title">Chat A</div></div>
            <div class="bubbles">
              <div class="scrollable bubbles-scrollable">
                <div class="bubble is-in" data-mid="1"><div class="message">hello</div></div>
                <div class="bubble is-out" data-mid="2"><div class="message">hi</div></div>
                <div class="bubble is-in" data-mid="3"><div class="message">again</div></div>
              </div>
            </div>
            <div class="chat-input"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
